<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Wordeth</title>
            <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/enhanced.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/cookie-consent.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-logo">
            <a href="/">
                <img src="images/logo.png" alt="Wordeth Logo" class="logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="verses.html">Verses</a>
            <a href="lyrics.html">Lyrics</a>
            <a href="merch.html">Merch</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-box">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to continue your musical journey</p>

            <div class="social-auth-buttons">
                <button class="social-auth-btn x">
                    <i class="fab fa-twitter"></i>
                    <span>Continue with X</span>
                </button>
                <button class="social-auth-btn instagram">
                    <i class="fab fa-instagram"></i>
                    <span>Continue with Instagram</span>
                </button>
                <button class="social-auth-btn facebook">
                    <i class="fab fa-facebook-f"></i>
                    <span>Continue with Facebook</span>
                </button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="signin-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <a href="/forgot-password" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="/signup.html">Sign Up</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cookie-consent.js"></script>
</body>
</html>
