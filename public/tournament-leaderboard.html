<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leaderboard - Verses Tournament - Wordeth</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tournaments.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/cookie-consent.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/mini-player.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-logo">
            <a href="/"><img src="images/logo.png" alt="Wordeth Logo" class="logo"></a>
        </div>
        <div class="nav-links">
            <a href="verses.html">Verses</a>
            <a href="verses-tournaments.html" class="active nav-link-tournament tournament-nav-item" style="display:none;"><i class="fas fa-trophy trophy-icon"></i> Tournaments</a>
            <a href="lyrics.html">Lyrics</a>
            <a href="merch.html">Merch</a>
            <a href="pricing.html">Pricing</a>
        </div>
        <div class="nav-auth">
            <a href="/signin.html" class="nav-signin-btn">Sign In</a>
        </div>
        <button class="menu-toggle" id="menuToggle">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-content">
            <div class="mobile-menu-header">
                <img src="images/logo.png" alt="Wordeth Logo" class="mobile-logo">
                <button class="mobile-menu-close" id="mobileMenuClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="mobile-menu-links">
                <a href="verses.html" class="mobile-menu-link"><i class="fas fa-headphones"></i><span>Verses</span></a>
                <a href="verses-tournaments.html" class="mobile-menu-link active tournament-nav-item" style="display:none;"><i class="fas fa-trophy"></i><span>Tournaments</span></a>
                <a href="lyrics.html" class="mobile-menu-link"><i class="fas fa-music"></i><span>Lyrics</span></a>
                <a href="merch.html" class="mobile-menu-link"><i class="fas fa-tshirt"></i><span>Merch</span></a>
                <a href="pricing.html" class="mobile-menu-link"><i class="fas fa-tags"></i><span>Pricing</span></a>
            </div>
            <div class="mobile-menu-auth">
                <a href="/signin.html" class="mobile-signin-btn"><i class="fas fa-user"></i><span>Sign In</span></a>
            </div>
        </div>
    </div>

    <main class="tournament-page">
        <div class="tournament-container">
            <div class="breadcrumb">
                <a href="verses-tournaments.html">Tournaments</a>
                <span class="sep">/</span>
                <span id="breadcrumbSeason">Leaderboard</span>
            </div>

            <h1 class="section-title" style="font-size:2rem; margin-bottom:0.5rem;"><i class="fas fa-medal"></i> Leaderboard</h1>
            <p style="color:rgba(255,255,255,0.6); margin-bottom:2rem;" id="leaderboardSubtitle">Top performing artists this season</p>

            <div class="tournament-sponsor-bar" id="sponsorBar" style="display:none;">
                <span class="sponsor-label">Leaderboard Sponsor</span>
                <span id="sponsorName"></span>
            </div>

            <table class="leaderboard-table" id="leaderboardTable">
                <thead>
                    <tr>
                        <th style="width:50px;">#</th>
                        <th>Artist</th>
                        <th>Points</th>
                        <th>W-L</th>
                        <th>Votes Received</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr><td colspan="5" style="text-align:center; padding:2rem;"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>

            <div id="winnersSection" style="margin-top:3rem;">
                <h2 class="section-title"><i class="fas fa-crown"></i> Match Winners</h2>
                <div class="matches-list" id="winnersList"></div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/utils.js"></script>
    <script src="js/tournament-nav.js"></script>
    <script src="js/tournament-leaderboard.js"></script>
</body>
</html>
