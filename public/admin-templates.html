<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Management - Wordeth Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a28;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --accent: #00ffa3;
            --accent-dim: rgba(0,255,163,0.1);
            --purple: #7c3aed;
            --red: #ef4444;
            --orange: #f59e0b;
            --blue: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .admin-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .admin-nav .nav-brand { display: flex; align-items: center; gap: 0.75rem; }
        .admin-nav .logo { height: 36px; }
        .admin-nav .nav-title { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--accent); }
        .admin-nav .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .admin-nav .nav-links a:hover { color: var(--accent); }

        .admin-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

        .admin-auth { text-align: center; padding: 4rem 1rem; }
        .auth-card {
            max-width: 380px; margin: 0 auto;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem;
        }
        .auth-card h2 { font-family: 'Unbounded', sans-serif; margin-bottom: 0.5rem; }
        .auth-card p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .auth-card input {
            width: 100%; padding: 0.7rem 1rem; margin-bottom: 0.75rem;
            border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface2); color: var(--text); font-size: 0.9rem;
        }
        .auth-card input:focus { outline: none; border-color: var(--accent); }
        .auth-error { color: var(--red); font-size: 0.85rem; display: none; margin-top: 0.5rem; }

        .btn {
            padding: 0.65rem 1.25rem; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #000; width: 100%; }
        .btn-primary:hover { opacity: 0.85; }
        .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.78rem; border-radius: 6px; }
        .btn-approve { background: var(--accent); color: #000; }
        .btn-reject { background: var(--red); color: #fff; }
        .btn-feature { background: var(--orange); color: #000; }
        .btn-unfeature { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-archive { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-generate { background: var(--purple); color: #fff; }

        .admin-content { display: none; }

        .stats-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 1rem 1.25rem; text-align: center;
        }
        .stat-value { font-size: 1.8rem; font-weight: 700; font-family: 'Unbounded', sans-serif; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card.pending .stat-value { color: var(--orange); }
        .stat-card.approved .stat-value { color: var(--accent); }
        .stat-card.featured .stat-value { color: var(--blue); }

        .admin-tabs {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;
        }
        .admin-tab {
            padding: 0.55rem 1.1rem; border: none; border-radius: 8px;
            background: transparent; color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 500; transition: all 0.2s;
        }
        .admin-tab.active { background: var(--accent-dim); color: var(--accent); }
        .admin-tab:hover { color: var(--text); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .filter-bar {
            display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center;
        }
        .filter-bar select, .filter-bar input {
            padding: 0.5rem 0.75rem; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface2); color: var(--text); font-size: 0.85rem;
        }

        .template-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 0.75rem;
            display: grid; grid-template-columns: 80px 1fr auto; gap: 1rem; align-items: center;
        }
        .template-preview {
            width: 80px; height: 80px; border-radius: 8px; overflow: hidden;
            background: var(--surface2); display: flex; align-items: center; justify-content: center;
        }
        .template-preview img { width: 100%; height: 100%; object-fit: cover; }
        .template-preview .no-preview { color: var(--text-muted); font-size: 1.5rem; }
        .template-info h4 { font-size: 1rem; margin-bottom: 0.25rem; }
        .template-meta {
            display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-muted);
        }
        .template-meta span i { margin-right: 0.2rem; }
        .template-id { font-family: monospace; font-size: 0.72rem; color: var(--purple); }
        .template-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.35rem; }
        .template-tags .tag {
            font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 10px;
            background: var(--accent-dim); color: var(--accent);
        }
        .template-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
        .status-badge {
            display: inline-block; padding: 0.2rem 0.6rem; border-radius: 6px;
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
        }
        .status-pending { background: rgba(245,158,11,0.15); color: var(--orange); }
        .status-approved { background: var(--accent-dim); color: var(--accent); }
        .status-rejected { background: rgba(239,68,68,0.15); color: var(--red); }
        .status-archived { background: rgba(100,100,120,0.15); color: var(--text-muted); }
        .featured-star { color: var(--orange); margin-left: 0.3rem; }

        .token-gen-section {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.5rem;
        }
        .token-gen-section h3 { font-family: 'Unbounded', sans-serif; margin-bottom: 0.75rem; }
        .token-gen-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
        .token-gen-row input {
            width: 80px; padding: 0.5rem; border-radius: 8px;
            border: 1px solid var(--border); background: var(--surface2); color: var(--text);
            text-align: center; font-size: 0.9rem;
        }
        .generated-tokens { margin-top: 1rem; }
        .gen-token {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 0.75rem; background: var(--surface2); border-radius: 8px;
            margin-bottom: 0.4rem; font-family: monospace; font-size: 0.82rem;
        }
        .gen-token .copy-btn {
            background: none; border: none; color: var(--accent); cursor: pointer;
            font-size: 0.8rem; padding: 0.2rem 0.4rem;
        }
        .gen-token .share-link {
            font-size: 0.72rem; color: var(--text-muted); margin-left: auto;
            word-break: break-all;
        }

        .reject-modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .reject-modal.show { display: flex; }
        .reject-modal-content {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 1.5rem; max-width: 420px; width: 90%;
        }
        .reject-modal-content h3 { font-family: 'Unbounded', sans-serif; margin-bottom: 0.75rem; }
        .reject-modal-content textarea {
            width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface2); color: var(--text); font-family: 'Outfit', sans-serif;
            min-height: 100px; resize: vertical; margin-bottom: 1rem;
        }
        .reject-modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

        .pagination {
            display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 1.5rem;
        }
        .pagination button {
            padding: 0.4rem 0.85rem; border-radius: 6px; border: 1px solid var(--border);
            background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.82rem;
        }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagination span { font-size: 0.82rem; color: var(--text-muted); }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }

        .toast-msg {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: var(--surface2); color: var(--text); padding: 0.75rem 1.5rem;
            border-radius: 10px; border: 1px solid var(--border); font-size: 0.85rem;
            z-index: 9999; animation: toastIn 0.3s ease;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }

        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .template-card { grid-template-columns: 1fr; }
            .template-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-brand">
            <img src="images/logo.png" alt="Wordeth" class="logo">
            <span class="nav-title">Template Admin</span>
        </div>
        <div class="nav-links">
            <a href="/w-admin.html"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-auth" id="admin-auth">
            <div class="auth-card">
                <h2>Admin Authentication</h2>
                <p>Sign in to manage design templates</p>
                <input type="email" id="admin-email" placeholder="Admin email">
                <input type="password" id="admin-password" placeholder="Password">
                <button class="btn btn-primary" id="admin-login-btn">Sign In</button>
                <p class="auth-error" id="auth-error"></p>
            </div>
        </div>

        <div class="admin-content" id="admin-content">
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">Total Templates</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-value" id="stat-pending">0</div>
                    <div class="stat-label">Pending Review</div>
                </div>
                <div class="stat-card approved">
                    <div class="stat-value" id="stat-approved">0</div>
                    <div class="stat-label">Approved</div>
                </div>
                <div class="stat-card featured">
                    <div class="stat-value" id="stat-featured">0</div>
                    <div class="stat-label">Featured</div>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="queue"><i class="fas fa-inbox"></i> Review Queue</button>
                <button class="admin-tab" data-tab="approved"><i class="fas fa-check-circle"></i> Approved</button>
                <button class="admin-tab" data-tab="tokens"><i class="fas fa-key"></i> Upload Tokens</button>
            </div>

            <div class="tab-panel active" id="panel-queue">
                <div class="filter-bar">
                    <select id="queueStatusFilter">
                        <option value="pending">Pending</option>
                        <option value="rejected">Rejected</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div id="queueList"></div>
                <div class="pagination" id="queuePagination"></div>
            </div>

            <div class="tab-panel" id="panel-approved">
                <div class="filter-bar">
                    <select id="approvedGenreFilter">
                        <option value="">All Genres</option>
                    </select>
                    <input type="text" id="approvedSearch" placeholder="Search artist or label...">
                </div>
                <div id="approvedList"></div>
                <div class="pagination" id="approvedPagination"></div>
            </div>

            <div class="tab-panel" id="panel-tokens">
                <div class="token-gen-section">
                    <h3>Generate Upload Tokens</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
                        Create shareable tokens for designers to upload templates. Each token allows up to 50 uploads.
                    </p>
                    <div class="token-gen-row">
                        <label style="font-size: 0.85rem;">Count:</label>
                        <input type="number" id="tokenCount" value="1" min="1" max="20">
                        <button class="btn btn-sm btn-generate" id="generateTokensBtn">
                            <i class="fas fa-key"></i> Generate
                        </button>
                    </div>
                    <div class="generated-tokens" id="generatedTokens"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="reject-modal" id="rejectModal">
        <div class="reject-modal-content">
            <h3>Reject Template</h3>
            <textarea id="rejectReason" placeholder="Reason for rejection (optional)..."></textarea>
            <div class="reject-modal-actions">
                <button class="btn btn-sm btn-archive" id="cancelReject">Cancel</button>
                <button class="btn btn-sm btn-reject" id="confirmReject">Reject</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var token = '';
        var queuePage = 1;
        var approvedPage = 1;
        var rejectingId = '';
        var base = window.location.origin;

        document.getElementById('admin-login-btn').addEventListener('click', doLogin);
        document.getElementById('admin-password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

        var saved = localStorage.getItem('authToken');
        if (saved) { token = saved; verifyAuth(); }

        function doLogin() {
            var email = document.getElementById('admin-email').value.trim();
            var pass = document.getElementById('admin-password').value;
            var errEl = document.getElementById('auth-error');
            errEl.style.display = 'none';

            fetch(base + '/api/auth/signin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pass })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('authToken', token);
                    verifyAuth();
                } else {
                    errEl.textContent = data.message || 'Login failed';
                    errEl.style.display = 'block';
                }
            })
            .catch(function() {
                errEl.textContent = 'Connection error';
                errEl.style.display = 'block';
            });
        }

        function verifyAuth() {
            fetch(base + '/api/auth/verify', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.user && data.user.role === 'ADMIN') {
                    document.getElementById('admin-auth').style.display = 'none';
                    document.getElementById('admin-content').style.display = 'block';
                    loadStats();
                    loadQueue();
                    loadGenres();
                } else {
                    showToast('Admin access required');
                    localStorage.removeItem('authToken');
                }
            })
            .catch(function() { localStorage.removeItem('authToken'); });
        }

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        }

        function loadStats() {
            Promise.all([
                fetch(base + '/api/templates/admin/queue?status=pending&limit=1', { headers: authHeaders() }).then(r => r.json()),
                fetch(base + '/api/templates/admin/queue?status=approved&limit=1', { headers: authHeaders() }).then(r => r.json())
            ]).then(function(results) {
                var pendingData = results[0];
                var approvedData = results[1];
                document.getElementById('stat-pending').textContent = pendingData.data ? pendingData.data.pendingCount : 0;
                document.getElementById('stat-approved').textContent = approvedData.data ? approvedData.data.pagination.total : 0;
                var totalNum = (pendingData.data ? pendingData.data.pagination.total : 0) + (approvedData.data ? approvedData.data.pagination.total : 0);
                document.getElementById('stat-total').textContent = totalNum;
            });
            fetch(base + '/api/templates/featured').then(r => r.json()).then(function(data) {
                document.getElementById('stat-featured').textContent = data.data ? data.data.length : 0;
            });
        }

        function loadGenres() {
            fetch(base + '/api/templates/admin/genres', { headers: authHeaders() }).then(r => r.json()).then(function(data) {
                if (data.data) {
                    var sel = document.getElementById('approvedGenreFilter');
                    data.data.forEach(function(g) {
                        var o = document.createElement('option');
                        o.value = g; o.textContent = g;
                        sel.appendChild(o);
                    });
                }
            });
        }

        document.querySelectorAll('.admin-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'approved') loadApproved();
            });
        });

        document.getElementById('queueStatusFilter').addEventListener('change', function() { queuePage = 1; loadQueue(); });
        document.getElementById('approvedGenreFilter').addEventListener('change', function() { approvedPage = 1; loadApproved(); });

        var searchDebounce;
        document.getElementById('approvedSearch').addEventListener('input', function() {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(function() { approvedPage = 1; loadApproved(); }, 400);
        });

        function loadQueue() {
            var status = document.getElementById('queueStatusFilter').value;
            fetch(base + '/api/templates/admin/queue?status=' + status + '&page=' + queuePage, { headers: authHeaders() })
            .then(r => r.json())
            .then(function(data) {
                if (!data.success) return;
                renderTemplateList('queueList', data.data.templates, status === 'pending');
                renderPagination('queuePagination', data.data.pagination, function(p) { queuePage = p; loadQueue(); });
            });
        }

        function loadApproved() {
            var genre = document.getElementById('approvedGenreFilter').value;
            var search = document.getElementById('approvedSearch').value.trim();
            var url = base + '/api/templates/admin/queue?status=approved&page=' + approvedPage;
            fetch(url, { headers: authHeaders() })
            .then(r => r.json())
            .then(function(data) {
                if (!data.success) return;
                var templates = data.data.templates;
                if (genre) templates = templates.filter(t => t.genre === genre);
                if (search) {
                    var s = search.toLowerCase();
                    templates = templates.filter(t =>
                        (t.artistName && t.artistName.toLowerCase().includes(s)) ||
                        (t.labelName && t.labelName.toLowerCase().includes(s)) ||
                        t.title.toLowerCase().includes(s)
                    );
                }
                renderTemplateList('approvedList', templates, false);
                renderPagination('approvedPagination', data.data.pagination, function(p) { approvedPage = p; loadApproved(); });
            });
        }

        function renderTemplateList(containerId, templates, showApproveReject) {
            var container = document.getElementById(containerId);
            if (!templates || templates.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No templates found</p></div>';
                return;
            }
            container.innerHTML = templates.map(function(t) {
                var preview = t.previewImageUrl
                    ? '<img src="' + t.previewImageUrl + '" alt="Preview">'
                    : (t.frontDesign && t.frontDesign.startsWith('data:')
                        ? '<img src="' + t.frontDesign + '" alt="Design">'
                        : '<div class="no-preview"><i class="fas fa-palette"></i></div>');

                var statusClass = 'status-' + t.status;
                var featured = t.featured ? '<i class="fas fa-star featured-star" title="Featured"></i>' : '';

                var actions = '';
                if (showApproveReject) {
                    actions = '<button class="btn btn-sm btn-approve" onclick="TA.approve(\'' + t.templateId + '\')"><i class="fas fa-check"></i> Approve</button>'
                        + '<button class="btn btn-sm btn-reject" onclick="TA.showReject(\'' + t.templateId + '\')"><i class="fas fa-times"></i> Reject</button>';
                } else if (t.status === 'approved') {
                    if (t.featured) {
                        actions = '<button class="btn btn-sm btn-unfeature" onclick="TA.feature(\'' + t.templateId + '\', false)"><i class="fas fa-star"></i> Unfeature</button>';
                    } else {
                        actions = '<button class="btn btn-sm btn-feature" onclick="TA.feature(\'' + t.templateId + '\', true)"><i class="far fa-star"></i> Feature</button>';
                    }
                    actions += '<button class="btn btn-sm btn-archive" onclick="TA.archive(\'' + t.templateId + '\')"><i class="fas fa-archive"></i></button>';
                }

                return '<div class="template-card">'
                    + '<div class="template-preview">' + preview + '</div>'
                    + '<div class="template-info">'
                    + '<h4>' + escHtml(t.title) + featured + '</h4>'
                    + '<span class="template-id">' + t.templateId + '</span> <span class="status-badge ' + statusClass + '">' + t.status + '</span>'
                    + '<div class="template-meta">'
                    + '<span><i class="fas fa-user"></i>' + escHtml(t.designerName) + '</span>'
                    + '<span><i class="fas fa-music"></i>' + escHtml(t.genre) + '</span>'
                    + (t.artistName ? '<span><i class="fas fa-microphone"></i>' + escHtml(t.artistName) + '</span>' : '')
                    + (t.labelName ? '<span><i class="fas fa-building"></i>' + escHtml(t.labelName) + '</span>' : '')
                    + '<span><i class="fas fa-shopping-bag"></i>' + (t.salesCount || 0) + ' sales</span>'
                    + '</div>'
                    + (t.tags && t.tags.length ? '<div class="template-tags">' + t.tags.map(function(tag) { return '<span class="tag">' + escHtml(tag) + '</span>'; }).join('') + '</div>' : '')
                    + '</div>'
                    + '<div class="template-actions">' + actions + '</div>'
                    + '</div>';
            }).join('');
        }

        function renderPagination(containerId, pag, onPage) {
            var el = document.getElementById(containerId);
            if (!pag || pag.pages <= 1) { el.innerHTML = ''; return; }
            el.innerHTML = '<button ' + (pag.page <= 1 ? 'disabled' : '') + ' id="' + containerId + 'Prev">Prev</button>'
                + '<span>Page ' + pag.page + ' of ' + pag.pages + '</span>'
                + '<button ' + (pag.page >= pag.pages ? 'disabled' : '') + ' id="' + containerId + 'Next">Next</button>';
            document.getElementById(containerId + 'Prev').addEventListener('click', function() { onPage(pag.page - 1); });
            document.getElementById(containerId + 'Next').addEventListener('click', function() { onPage(pag.page + 1); });
        }

        window.TA = {
            approve: function(id) {
                fetch(base + '/api/templates/admin/' + id + '/approve', { method: 'PATCH', headers: authHeaders() })
                .then(r => r.json())
                .then(function(data) {
                    if (data.success) { showToast('Template approved'); loadQueue(); loadStats(); }
                    else showToast(data.message || 'Failed');
                });
            },
            showReject: function(id) {
                rejectingId = id;
                document.getElementById('rejectReason').value = '';
                document.getElementById('rejectModal').classList.add('show');
            },
            feature: function(id, val) {
                fetch(base + '/api/templates/admin/' + id + '/feature', {
                    method: 'PATCH', headers: authHeaders(),
                    body: JSON.stringify({ featured: val })
                })
                .then(r => r.json())
                .then(function(data) {
                    if (data.success) { showToast(val ? 'Template featured' : 'Removed from featured'); loadApproved(); loadStats(); }
                    else showToast(data.message || 'Failed');
                });
            },
            archive: function(id) {
                if (!confirm('Archive this template?')) return;
                fetch(base + '/api/templates/admin/' + id, { method: 'DELETE', headers: authHeaders() })
                .then(r => r.json())
                .then(function(data) {
                    if (data.success) { showToast('Template archived'); loadApproved(); loadStats(); }
                    else showToast(data.message || 'Failed');
                });
            }
        };

        document.getElementById('cancelReject').addEventListener('click', function() {
            document.getElementById('rejectModal').classList.remove('show');
        });
        document.getElementById('confirmReject').addEventListener('click', function() {
            var reason = document.getElementById('rejectReason').value.trim();
            fetch(base + '/api/templates/admin/' + rejectingId + '/reject', {
                method: 'PATCH', headers: authHeaders(),
                body: JSON.stringify({ reason: reason })
            })
            .then(r => r.json())
            .then(function(data) {
                document.getElementById('rejectModal').classList.remove('show');
                if (data.success) { showToast('Template rejected'); loadQueue(); loadStats(); }
                else showToast(data.message || 'Failed');
            });
        });

        document.getElementById('generateTokensBtn').addEventListener('click', function() {
            var count = parseInt(document.getElementById('tokenCount').value) || 1;
            fetch(base + '/api/templates/upload-tokens', {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({ count: count })
            })
            .then(r => r.json())
            .then(function(data) {
                if (data.success && data.data.tokens) {
                    var container = document.getElementById('generatedTokens');
                    var shareBase = window.location.origin + '/designer-upload.html?token=';
                    container.innerHTML = data.data.tokens.map(function(tk) {
                        return '<div class="gen-token">'
                            + '<code>' + tk + '</code>'
                            + '<button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + shareBase + tk + '\');this.innerHTML=\'<i class=&quot;fas fa-check&quot;></i>\'"><i class="fas fa-copy"></i></button>'
                            + '<span class="share-link">' + shareBase + tk + '</span>'
                            + '</div>';
                    }).join('');
                    showToast(data.data.tokens.length + ' token(s) generated');
                }
            });
        });

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            var old = document.querySelector('.toast-msg');
            if (old) old.remove();
            var el = document.createElement('div');
            el.className = 'toast-msg';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 3000);
        }
    })();
    </script>
</body>
</html>
