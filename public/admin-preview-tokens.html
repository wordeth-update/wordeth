<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview Tokens — Wordeth Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
    --bg: #0a0612;
    --bg-2: #14091f;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.6);
    --purple: #b794ff;
    --mint: #4dffb8;
    --danger: #ff6680;
}
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, rgba(120,60,200,0.25), transparent),
                radial-gradient(900px 500px at 90% 110%, rgba(77,255,184,0.10), transparent),
                var(--bg);
    color: var(--text); font-family: 'Outfit', system-ui, sans-serif;
    padding: 32px 20px 80px;
}
.container { max-width: 1100px; margin: 0 auto; }
h1 { font-family: 'Syne', sans-serif; font-size: 28px; margin: 0 0 4px; }
.sub { color: var(--muted); margin-bottom: 28px; }
.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px; margin-bottom: 22px;
    backdrop-filter: blur(8px);
}
.card h2 { font-family: 'Syne', sans-serif; font-size: 18px; margin: 0 0 14px; }
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 720px) { .row { grid-template-columns: 1fr 1fr; } }
label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
input, select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(0,0,0,0.3);
    color: var(--text); font: inherit;
}
input:focus, select:focus { outline: none; border-color: var(--purple); }
button {
    padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
    font: inherit; font-weight: 600;
    background: linear-gradient(135deg, var(--purple), var(--mint));
    color: #0a0612;
}
button:hover { filter: brightness(1.08); }
button.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
button.danger { background: rgba(255,102,128,0.18); color: var(--danger); }
.actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.url { color: var(--mint); word-break: break-all; font-family: 'SF Mono', monospace; font-size: 12px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge.ok { background: rgba(77,255,184,0.15); color: var(--mint); }
.badge.bad { background: rgba(255,102,128,0.15); color: var(--danger); }
.copy-btn { background: rgba(255,255,255,0.08); color: var(--text); padding: 4px 10px; font-size: 12px; }
.muted { color: var(--muted); font-size: 12px; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 12px 22px; border-radius: 10px;
    background: rgba(77,255,184,0.95); color: #0a0612; font-weight: 600;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
    <h1>Preview Tokens</h1>
    <p class="sub">Mint time-limited bypass links for testers, partners, or quick demos. Master token (env-driven) is unaffected.</p>

    <div class="card">
        <h2>Mint a new bravo token</h2>
        <div class="row">
            <div>
                <label>Label</label>
                <input id="f-label" placeholder="e.g. Demo for Atlantic Records" />
            </div>
            <div>
                <label>Cookie TTL (hours)</label>
                <select id="f-ttl">
                    <option value="1">1 hour</option>
                    <option value="6">6 hours</option>
                    <option value="24" selected>24 hours</option>
                    <option value="72">3 days</option>
                    <option value="168">7 days</option>
                    <option value="720">30 days</option>
                </select>
            </div>
            <div>
                <label>Token expires after (days, optional)</label>
                <input id="f-expires" type="number" min="1" placeholder="e.g. 7" />
            </div>
            <div>
                <label>Max uses (0 = unlimited)</label>
                <input id="f-maxuses" type="number" min="0" value="0" />
            </div>
        </div>
        <div class="actions">
            <button id="btn-create">Create token</button>
        </div>
    </div>

    <div class="card">
        <h2>Existing tokens</h2>
        <div id="list">
            <div class="empty">Loading…</div>
        </div>
    </div>
</div>
<div id="toast" class="toast">Copied!</div>

<script>
const TOKEN_KEY = 'token';
const auth = () => localStorage.getItem(TOKEN_KEY);
const headers = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (auth() || '') });

if (!auth()) {
    document.body.innerHTML = '<div class="container"><div class="card"><h2>Sign in required</h2><p class="muted">Log in as an admin first, then come back to this page.</p><a href="/login.html"><button>Go to login</button></a></div></div>';
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
}

function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString();
}

function ttlLabel(seconds) {
    const h = seconds / 3600;
    if (h < 24) return h + 'h';
    return (h / 24) + 'd';
}

function statusBadge(item) {
    if (item.revoked) return '<span class="badge bad">Revoked</span>';
    if (item.tokenExpiresAt && new Date(item.tokenExpiresAt) < new Date()) return '<span class="badge bad">Expired</span>';
    if (item.maxUses > 0 && item.useCount >= item.maxUses) return '<span class="badge bad">Used up</span>';
    return '<span class="badge ok">Active</span>';
}

function previewUrl(token) {
    return window.location.origin + '/?preview=' + encodeURIComponent(token);
}

async function load() {
    const list = document.getElementById('list');
    try {
        const r = await fetch('/api/coming-soon/preview-tokens', { headers: headers() });
        if (r.status === 401 || r.status === 403) {
            list.innerHTML = '<div class="empty">Admin access required.</div>'; return;
        }
        const data = await r.json();
        if (!data.items || !data.items.length) {
            list.innerHTML = '<div class="empty">No bravo tokens yet. Mint one above.</div>'; return;
        }
        list.innerHTML = '<table><thead><tr><th>Label</th><th>Status</th><th>Cookie TTL</th><th>Expires</th><th>Uses</th><th>Share URL</th><th></th></tr></thead><tbody>' +
            data.items.map(item => `
                <tr>
                    <td>${escapeHtml(item.label || '(no label)')}<br><span class="muted">${fmtDate(item.createdAt)}</span></td>
                    <td>${statusBadge(item)}</td>
                    <td>${ttlLabel(item.ttlSeconds)}</td>
                    <td>${item.tokenExpiresAt ? fmtDate(item.tokenExpiresAt) : 'never'}</td>
                    <td>${item.useCount}${item.maxUses ? ' / ' + item.maxUses : ''}</td>
                    <td><span class="url">${escapeHtml(previewUrl(item.token))}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="copy-btn" data-copy="${escapeAttr(previewUrl(item.token))}">Copy</button>
                        ${item.revoked
                            ? `<button class="copy-btn" data-unrevoke="${item._id}">Restore</button>`
                            : `<button class="copy-btn" data-revoke="${item._id}">Revoke</button>`}
                        <button class="copy-btn danger" data-delete="${item._id}">Delete</button>
                    </td>
                </tr>
            `).join('') + '</tbody></table>';
    } catch (err) {
        list.innerHTML = '<div class="empty">Failed to load: ' + escapeHtml(err.message || String(err)) + '</div>';
    }
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById('btn-create').addEventListener('click', async () => {
    const label = document.getElementById('f-label').value.trim();
    const ttlHours = parseFloat(document.getElementById('f-ttl').value);
    const expiresInDaysRaw = document.getElementById('f-expires').value.trim();
    const maxUsesRaw = document.getElementById('f-maxuses').value.trim();
    const body = { label, ttlHours };
    if (expiresInDaysRaw) body.expiresInDays = parseFloat(expiresInDaysRaw);
    if (maxUsesRaw) body.maxUses = parseInt(maxUsesRaw, 10);
    try {
        const r = await fetch('/api/coming-soon/preview-tokens', {
            method: 'POST', headers: headers(), body: JSON.stringify(body)
        });
        const data = await r.json();
        if (!data.success) { alert(data.message || 'Failed'); return; }
        document.getElementById('f-label').value = '';
        toast('Token created');
        load();
    } catch (err) {
        alert('Error: ' + (err.message || err));
    }
});

document.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.dataset.copy) {
        try { await navigator.clipboard.writeText(t.dataset.copy); toast('Link copied'); }
        catch { prompt('Copy this link:', t.dataset.copy); }
    } else if (t.dataset.revoke || t.dataset.unrevoke) {
        const id = t.dataset.revoke || t.dataset.unrevoke;
        const revoked = !!t.dataset.revoke;
        const r = await fetch('/api/coming-soon/preview-tokens/' + id, {
            method: 'PATCH', headers: headers(), body: JSON.stringify({ revoked })
        });
        const data = await r.json();
        if (!data.success) { alert(data.message || 'Failed'); return; }
        load();
    } else if (t.dataset.delete) {
        if (!confirm('Delete this token permanently? Anyone who already redeemed it will keep access until their cookie expires.')) return;
        const r = await fetch('/api/coming-soon/preview-tokens/' + t.dataset.delete, {
            method: 'DELETE', headers: headers()
        });
        const data = await r.json();
        if (!data.success) { alert(data.message || 'Failed'); return; }
        load();
    }
});

load();
</script>
</body>
</html>
