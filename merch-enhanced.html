<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Your Merch - Wordeth</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .merch-enhanced-container {
            padding: 2rem;
            max-width: 1400px;
            margin: 80px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .product-selection {
            background: var(--purple-dark);
            border-radius: 20px;
            padding: 2rem;
            height: fit-content;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--mint);
        }

        .product-card.selected {
            border-color: var(--mint);
            background: rgba(150, 197, 176, 0.1);
        }

        .product-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .product-name {
            color: var(--white);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            color: var(--mint);
            font-weight: 700;
        }

        .customization-panel {
            background: var(--purple-dark);
            border-radius: 20px;
            padding: 2rem;
        }

        .design-preview {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .preview-placeholder {
            text-align: center;
            color: #666;
        }

        .preview-placeholder i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ccc;
        }

        .custom-text {
            position: absolute;
            cursor: move;
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            user-select: none;
            max-width: 200px;
            word-wrap: break-word;
        }

        .option-group {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
        }

        .option-group h3 {
            color: var(--mint);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .lyrics-input {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-size: 1rem;
            margin-bottom: 1rem;
            resize: vertical;
            min-height: 100px;
        }

        .lyrics-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .font-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.5rem;
        }

        .font-option {
            background: var(--purple-light);
            border: none;
            color: var(--white);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .font-option.active {
            background: var(--mint);
            color: var(--black);
        }

        .color-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.3s ease;
        }

        .color-option.active {
            border-color: var(--mint);
        }

        .size-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .size-option {
            background: var(--purple-light);
            border: none;
            color: var(--white);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .size-option.active {
            background: var(--mint);
            color: var(--black);
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .quantity-btn {
            background: var(--purple-light);
            border: none;
            color: var(--white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .quantity-btn:hover {
            background: var(--mint);
            color: var(--black);
        }

        .quantity-display {
            color: var(--white);
            font-size: 1.2rem;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .order-summary {
            background: rgba(150, 197, 176, 0.1);
            border: 1px solid var(--mint);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        .summary-total {
            border-top: 1px solid var(--mint);
            padding-top: 1rem;
            margin-top: 1rem;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--mint);
        }

        .buy-button {
            width: 100%;
            background: linear-gradient(135deg, var(--mint) 0%, var(--purple-accent) 100%);
            color: var(--black);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(150, 197, 176, 0.4);
        }

        .buy-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(150, 197, 176, 0.6);
        }

        .buy-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .merch-enhanced-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 1rem;
            }
            
            .product-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <nav class="main-nav">
        <div class="nav-logo">
            <a href="/">
                <img src="images/logo.png" alt="Wordeth Logo" class="logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="lyrics.html">Lyrics</a>
            <a href="articles.html">Articles</a>
            <a href="merch.html" class="active">Merchandise</a>
            <a href="video-rooms.html">Community</a>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search merchandise...">
            <button class="search-button">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <button class="nav-signin-btn">Sign In</button>
        <button class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <div class="merch-enhanced-container">
        <div class="product-selection">
            <h2>Choose Your Product</h2>
            <div class="product-grid" id="productGrid">
                <!-- Products will be loaded here -->
                <div class="loading-spinner"></div>
            </div>
        </div>

        <div class="customization-panel">
            <h2>Design Your Merch</h2>
            
            <div class="design-preview" id="designPreview">
                <div class="preview-placeholder">
                    <i class="fas fa-tshirt"></i>
                    <p>Select a product to start designing</p>
                </div>
            </div>

            <div class="option-group">
                <h3>Your Lyrics</h3>
                <textarea 
                    class="lyrics-input" 
                    id="lyricsInput" 
                    placeholder="Enter your favorite lyrics here..."
                ></textarea>
            </div>

            <div class="option-group">
                <h3>Font Style</h3>
                <div class="font-options" id="fontOptions">
                    <button class="font-option active" data-font="Arial">Arial</button>
                    <button class="font-option" data-font="Times New Roman">Times</button>
                    <button class="font-option" data-font="Courier New">Courier</button>
                    <button class="font-option" data-font="Georgia">Georgia</button>
                    <button class="font-option" data-font="Verdana">Verdana</button>
                </div>
            </div>

            <div class="option-group">
                <h3>Text Color</h3>
                <div class="color-options" id="colorOptions">
                    <div class="color-option active" style="background: #000000;" data-color="#000000"></div>
                    <div class="color-option" style="background: #ffffff; border: 1px solid #ccc;" data-color="#ffffff"></div>
                    <div class="color-option" style="background: #96C5B0;" data-color="#96C5B0"></div>
                    <div class="color-option" style="background: #5F0E82;" data-color="#5F0E82"></div>
                    <div class="color-option" style="background: #ff6b6b;" data-color="#ff6b6b"></div>
                    <div class="color-option" style="background: #4ecdc4;" data-color="#4ecdc4"></div>
                </div>
            </div>

            <div class="option-group">
                <h3>Size</h3>
                <div class="size-options" id="sizeOptions">
                    <button class="size-option">S</button>
                    <button class="size-option">M</button>
                    <button class="size-option active">L</button>
                    <button class="size-option">XL</button>
                    <button class="size-option">2XL</button>
                </div>
            </div>

            <div class="option-group">
                <h3>Quantity</h3>
                <div class="quantity-selector">
                    <button class="quantity-btn" id="decreaseQuantity">-</button>
                    <span class="quantity-display" id="quantityDisplay">1</span>
                    <button class="quantity-btn" id="increaseQuantity">+</button>
                </div>
            </div>

            <div class="order-summary" id="orderSummary" style="display: none;">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Product:</span>
                    <span id="summaryProduct">-</span>
                </div>
                <div class="summary-row">
                    <span>Size:</span>
                    <span id="summarySize">-</span>
                </div>
                <div class="summary-row">
                    <span>Quantity:</span>
                    <span id="summaryQuantity">-</span>
                </div>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="summarySubtotal">-</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total:</span>
                    <span id="summaryTotal">-</span>
                </div>
            </div>

            <button class="buy-button" id="buyButton" disabled>
                <span id="buyButtonText">Select a product to continue</span>
            </button>
        </div>
    </div>

    <script>
        class MerchDesigner {
            constructor() {
                this.selectedProduct = null;
                this.selectedSize = 'L';
                this.quantity = 1;
                this.currentFont = 'Arial';
                this.currentColor = '#000000';
                this.draggableText = null;
                this.isDragging = false;
                this.currentX = 0;
                this.currentY = 0;
                this.initialX = 0;
                this.initialY = 0;
                this.xOffset = 0;
                this.yOffset = 0;

                this.initializeElements();
                this.loadProducts();
                this.setupEventListeners();
            }

            initializeElements() {
                this.productGrid = document.getElementById('productGrid');
                this.designPreview = document.getElementById('designPreview');
                this.lyricsInput = document.getElementById('lyricsInput');
                this.fontOptions = document.getElementById('fontOptions');
                this.colorOptions = document.getElementById('colorOptions');
                this.sizeOptions = document.getElementById('sizeOptions');
                this.quantityDisplay = document.getElementById('quantityDisplay');
                this.orderSummary = document.getElementById('orderSummary');
                this.buyButton = document.getElementById('buyButton');
                this.buyButtonText = document.getElementById('buyButtonText');
            }

            async loadProducts() {
                try {
                    const response = await fetch('/api/merch/products');
                    const data = await response.json();
                    
                    if (data.success) {
                        this.displayProducts(data.data);
                    } else {
                        this.showError('Failed to load products');
                    }
                } catch (error) {
                    console.error('Error loading products:', error);
                    this.showError('Failed to load products');
                }
            }

            displayProducts(products) {
                this.productGrid.innerHTML = '';
                
                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.innerHTML = `
                        <img src="${product.imageUrl || 'https://via.placeholder.com/150x120'}" 
                             alt="${product.name}" class="product-image">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">$${product.price}</div>
                    `;
                    
                    productCard.addEventListener('click', () => this.selectProduct(product));
                    this.productGrid.appendChild(productCard);
                });
            }

            selectProduct(product) {
                // Remove previous selection
                document.querySelectorAll('.product-card').forEach(card => {
                    card.classList.remove('selected');
                });

                // Add selection to clicked card
                event.target.closest('.product-card').classList.add('selected');
                
                this.selectedProduct = product;
                this.updateDesignPreview();
                this.updateOrderSummary();
                this.updateBuyButton();
            }

            updateDesignPreview() {
                if (!this.selectedProduct) return;

                this.designPreview.innerHTML = `
                    <img src="${this.selectedProduct.imageUrl || 'https://via.placeholder.com/400x400'}" 
                         alt="${this.selectedProduct.name}" style="max-width: 100%; height: auto;">
                    <div class="custom-text" id="customText" style="font-family: ${this.currentFont}; color: ${this.currentColor};">
                        ${this.lyricsInput.value || 'Your lyrics here...'}
                    </div>
                `;

                this.draggableText = document.getElementById('customText');
                this.setupDraggable();
            }

            setupDraggable() {
                if (!this.draggableText) return;

                this.draggableText.addEventListener('mousedown', this.dragStart.bind(this));
                document.addEventListener('mousemove', this.drag.bind(this));
                document.addEventListener('mouseup', this.dragEnd.bind(this));
            }

            dragStart(e) {
                this.initialX = e.clientX - this.xOffset;
                this.initialY = e.clientY - this.yOffset;

                if (e.target === this.draggableText) {
                    this.isDragging = true;
                }
            }

            drag(e) {
                if (this.isDragging) {
                    e.preventDefault();
                    this.currentX = e.clientX - this.initialX;
                    this.currentY = e.clientY - this.initialY;
                    this.xOffset = this.currentX;
                    this.yOffset = this.currentY;

                    this.setTranslate(this.currentX, this.currentY, this.draggableText);
                }
            }

            dragEnd(e) {
                this.initialX = this.currentX;
                this.initialY = this.currentY;
                this.isDragging = false;
            }

            setTranslate(xPos, yPos, el) {
                el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
            }

            updateOrderSummary() {
                if (!this.selectedProduct) {
                    this.orderSummary.style.display = 'none';
                    return;
                }

                const subtotal = this.selectedProduct.price * this.quantity;
                const total = subtotal; // Add shipping later

                document.getElementById('summaryProduct').textContent = this.selectedProduct.name;
                document.getElementById('summarySize').textContent = this.selectedSize;
                document.getElementById('summaryQuantity').textContent = this.quantity;
                document.getElementById('summarySubtotal').textContent = `$${subtotal.toFixed(2)}`;
                document.getElementById('summaryTotal').textContent = `$${total.toFixed(2)}`;

                this.orderSummary.style.display = 'block';
            }

            updateBuyButton() {
                if (this.selectedProduct) {
                    this.buyButton.disabled = false;
                    this.buyButtonText.textContent = `Buy Now - $${(this.selectedProduct.price * this.quantity).toFixed(2)}`;
                } else {
                    this.buyButton.disabled = true;
                    this.buyButtonText.textContent = 'Select a product to continue';
                }
            }

            setupEventListeners() {
                // Lyrics input
                this.lyricsInput.addEventListener('input', () => {
                    if (this.draggableText) {
                        this.draggableText.textContent = this.lyricsInput.value || 'Your lyrics here...';
                    }
                });

                // Font options
                this.fontOptions.addEventListener('click', (e) => {
                    if (e.target.classList.contains('font-option')) {
                        this.fontOptions.querySelectorAll('.font-option').forEach(opt => opt.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFont = e.target.dataset.font;
                        
                        if (this.draggableText) {
                            this.draggableText.style.fontFamily = this.currentFont;
                        }
                    }
                });

                // Color options
                this.colorOptions.addEventListener('click', (e) => {
                    if (e.target.classList.contains('color-option')) {
                        this.colorOptions.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentColor = e.target.dataset.color;
                        
                        if (this.draggableText) {
                            this.draggableText.style.color = this.currentColor;
                        }
                    }
                });

                // Size options
                this.sizeOptions.addEventListener('click', (e) => {
                    if (e.target.classList.contains('size-option')) {
                        this.sizeOptions.querySelectorAll('.size-option').forEach(opt => opt.classList.remove('active'));
                        e.target.classList.add('active');
                        this.selectedSize = e.target.textContent;
                        this.updateOrderSummary();
                    }
                });

                // Quantity buttons
                document.getElementById('decreaseQuantity').addEventListener('click', () => {
                    if (this.quantity > 1) {
                        this.quantity--;
                        this.quantityDisplay.textContent = this.quantity;
                        this.updateOrderSummary();
                        this.updateBuyButton();
                    }
                });

                document.getElementById('increaseQuantity').addEventListener('click', () => {
                    this.quantity++;
                    this.quantityDisplay.textContent = this.quantity;
                    this.updateOrderSummary();
                    this.updateBuyButton();
                });

                // Buy button
                this.buyButton.addEventListener('click', () => this.processOrder());
            }

            async processOrder() {
                if (!this.selectedProduct || !this.lyricsInput.value.trim()) {
                    this.showError('Please select a product and enter lyrics');
                    return;
                }

                this.buyButton.disabled = true;
                this.buyButtonText.innerHTML = '<span class="loading-spinner"></span> Processing...';

                try {
                    // Create design
                    const designResponse = await fetch('/api/merch/designs', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.getAuthToken()}`
                        },
                        body: JSON.stringify({
                            productId: this.selectedProduct.id,
                            lyrics: this.lyricsInput.value,
                            options: {
                                font: this.currentFont,
                                color: this.currentColor,
                                position: { x: this.xOffset, y: this.yOffset }
                            }
                        })
                    });

                    const designData = await designResponse.json();
                    
                    if (!designData.success) {
                        throw new Error(designData.message);
                    }

                    // Create order
                    const orderResponse = await fetch('/api/merch/orders', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.getAuthToken()}`
                        },
                        body: JSON.stringify({
                            designId: designData.data.id,
                            productId: this.selectedProduct.id,
                            quantity: this.quantity,
                            customerInfo: {
                                // This would come from user profile
                                name: 'User Name',
                                email: 'user@example.com'
                            },
                            shippingInfo: {
                                // This would come from form
                                address: '123 Main St',
                                city: 'City',
                                state: 'State',
                                zipCode: '12345',
                                country: 'US'
                            }
                        })
                    });

                    const orderData = await orderResponse.json();
                    
                    if (orderData.success) {
                        this.showSuccess('Order placed successfully!');
                        // Redirect to order confirmation or show order details
                    } else {
                        throw new Error(orderData.message);
                    }

                } catch (error) {
                    console.error('Error processing order:', error);
                    this.showError('Failed to process order. Please try again.');
                } finally {
                    this.buyButton.disabled = false;
                    this.buyButtonText.textContent = `Buy Now - $${(this.selectedProduct.price * this.quantity).toFixed(2)}`;
                }
            }

            getAuthToken() {
                // This would get the actual auth token from your auth system
                return localStorage.getItem('authToken') || '';
            }

            showError(message) {
                // Simple error display - you might want to enhance this
                alert(message);
            }

            showSuccess(message) {
                // Simple success display - you might want to enhance this
                alert(message);
            }
        }

        // Initialize the merch designer when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new MerchDesigner();
        });
    </script>
</body>
</html>
