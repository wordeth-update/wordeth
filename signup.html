<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Wordeth</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/enhanced.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-logo">
            <a href="/">
                <img src="images/logo.png" alt="Wordeth Logo" class="logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="verses.html">Verses</a>
            <a href="lyrics.html">Lyrics</a>
            <a href="merch.html">Merch</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-box">
            <h1>Join Wordeth</h1>
            <p class="auth-subtitle">Create an account to start your musical journey</p>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required minlength="2">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <small class="form-hint">At least 6 characters</small>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="/signin.html">Sign In</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
