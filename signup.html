<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Wordeth</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/enhanced.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/cookie-consent.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-logo">
            <a href="/">
                <img src="images/logo.png" alt="Wordeth Logo" class="logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="verses.html">Verses</a>
            <a href="lyrics.html">Lyrics</a>
            <a href="merch.html">Merch</a>
        </div>
        <button class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-content">
            <div class="mobile-menu-header">
                <img src="images/logo.png" alt="Wordeth Logo" class="mobile-logo">
                <button class="mobile-menu-close" id="mobileMenuClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="mobile-menu-links">
                <a href="verses.html" class="mobile-menu-link">
                    <i class="fas fa-headphones"></i>
                    <span>Verses</span>
                </a>
                <a href="lyrics.html" class="mobile-menu-link">
                    <i class="fas fa-music"></i>
                    <span>Lyrics</span>
                </a>
                <a href="merch.html" class="mobile-menu-link">
                    <i class="fas fa-tshirt"></i>
                    <span>Merch</span>
                </a>
            </div>
            <div class="mobile-menu-search">
                <input type="text" placeholder="Search..." class="mobile-search-input">
                <button class="mobile-search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="mobile-menu-auth">
                <a href="/signin.html" class="mobile-signin-btn">
                    <i class="fas fa-user"></i>
                    <span>Sign In</span>
                </a>
            </div>
        </div>
    </div>

    <main class="auth-container">
        <div class="auth-box">
            <h1>Join Wordeth</h1>
            <p class="auth-subtitle">Create an account to start your musical journey</p>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="50">
                    <small class="name-status" id="name-status"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <small class="form-hint">At least 6 characters</small>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <div class="form-group terms-group">
                    <label class="terms-checkbox-label">
                        <input type="checkbox" id="agree-terms" name="agree-terms" required>
                        <span class="terms-text">I have read and agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a></span>
                    </label>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="/signin.html">Sign In</a>
            </p>
            <p class="auth-switch" style="margin-top:0.5rem;">
                Are you an artist or designer? <a href="/creator-register.html">Register as Creator</a>
            </p>
        </div>
    </main>

    <script>
    (function() {
        const nameInput = document.getElementById('name');
        const nameStatus = document.getElementById('name-status');
        let checkTimeout;
        if (nameInput && nameStatus) {
            nameInput.addEventListener('input', () => {
                clearTimeout(checkTimeout);
                const val = nameInput.value.trim();
                if (val.length < 2) {
                    nameStatus.textContent = '';
                    nameStatus.className = 'name-status';
                    return;
                }
                nameStatus.textContent = 'Checking...';
                nameStatus.className = 'name-status checking';
                checkTimeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/user/check-name?name=${encodeURIComponent(val)}`);
                        const data = await res.json();
                        if (nameInput.value.trim() !== val) return;
                        if (data.available) {
                            nameStatus.textContent = 'Name is available';
                            nameStatus.className = 'name-status available';
                        } else {
                            nameStatus.textContent = 'Name is already taken';
                            nameStatus.className = 'name-status taken';
                        }
                    } catch (e) {
                        nameStatus.textContent = '';
                        nameStatus.className = 'name-status';
                    }
                }, 400);
            });
        }
    })();
    </script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cookie-consent.js"></script>
</body>
</html>
